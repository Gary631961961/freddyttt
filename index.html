
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapStream - Download Instagram Media Easily</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0f2fe;
            color: #0f172a;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #f0f9ff 0%, #e0f2fe 100%);
        }

        /* Enhanced Liquid Blobs - strictly light blue palette */
        .blob {
            position: absolute;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: liquid-move 20s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 800px;
            height: 800px;
            background: #bae6fd; /* light blue */
            top: -20%;
            left: -10%;
            animation-duration: 25s;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #7dd3fc; /* sky blue */
            bottom: -10%;
            right: -5%;
            animation-delay: -7s;
            animation-duration: 30s;
        }

        .blob-3 {
            width: 500px;
            height: 500px;
            background: #f0f9ff; /* alice blue */
            top: 30%;
            left: 40%;
            animation-duration: 22s;
            animation-delay: -12s;
        }

        @keyframes liquid-move {
            0% { 
                transform: translate(0, 0) scale(1) rotate(0deg); 
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
            33% { 
                transform: translate(80px, 40px) scale(1.1) rotate(20deg); 
                border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
            }
            66% { 
                transform: translate(-40px, 120px) scale(0.9) rotate(-20deg); 
                border-radius: 30% 70% 40% 60% / 60% 40% 70% 30%;
            }
            100% { 
                transform: translate(0, 0) scale(1) rotate(0deg); 
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            }
        }

        /* Glassmorphism Classes */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Subtle shimmering texture */
        .liquid-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div id="root"></div>
    <!-- Entry point script -->
    <script type="module" src="index.tsx"></script>
</body>
</html>
